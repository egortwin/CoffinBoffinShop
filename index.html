<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка...</title>
    <link rel="stylesheet" href="css/style.css?v=20261111-4">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <header class="shop-header">
            <div class="shop-logo">
                <img id="logo-img" src="" alt="Логотип">
            </div>
            <h1 id="shop-title" class="shop-title"></h1>
            <button id="cart-button" class="cart-button">
                🛒 <span id="cart-counter">0</span>
            </button>
        </header>

        <section class="categories-section">
            <div id="categories-container" class="categories-container">
                <!-- Категории будут добавлены здесь -->
            </div>
        </section>

        <section class="products-section">
            <main id="product-catalog" class="product-catalog">
                <!-- Карточки товаров будут добавлены здесь -->
            </main>
        </section>

        <div id="loader" style="display: block;">
            <div class="loader-spinner"></div>
            Загрузка товаров...
        </div>
    </div>

    <!-- Модальное окно корзины -->
    <div id="cart-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button id="close-cart-button" class="close-button">×</button>
            <h2>🛒 Ваша корзина</h2>
            <div id="cart-items-container">
                <!-- Товары корзины будут добавлены здесь -->
            </div>
            <div class="cart-summary" style="display: none;">
                <strong>💰 Итого: <span id="cart-total-price">0 ₽</span></strong>
            </div>
            <div id="order-form" style="display: none;">
                <p class="checkout-hint">Нажмите кнопку — откроется ваш чат с продавцом и подготовится сообщение с составом заказа.</p>
                <button id="submit-order-button" class="submit-order-button">
                    Купить в Telegram
                </button>
            </div>
        </div>
    </div>

    <!-- Подключение скриптов -->
    <!-- ИСПРАВЛЕНО: Сначала встроенный каталог, потом конфиги -->
    <script src="embedded-catalog.js?v=20261111-2"></script>
    <script src="config/shop-config.js?v=20261111-2"></script>
    <script src="config/categories.js?v=20261111-2"></script>
    <script src="js/app.js?v=20261111-5"></script>
</body>
</html>
